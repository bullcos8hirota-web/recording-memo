name: Deploy apps to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            swing/package-lock.json

      - name: Install dependencies (recording memo)
        working-directory: app
        run: npm ci

      - name: Build recording memo
        working-directory: app
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Install dependencies (swing)
        working-directory: swing
        run: npm ci

      - name: Build swing trade app
        working-directory: swing
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/swing/
        run: npm run build

      # 録音メモをルート、スイングアプリを /swing/ に置く
      - name: Merge sites
        run: cp -r swing/dist app/dist/swing

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
